<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A live demo of the dev-vijay-simple-password-generator npm package." />
    <title>Password Generator Demo</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">NPM package demo</p>
        <h1 id="page-title">Password Generator</h1>
        <p class="intro">Try <code>dev-vijay-simple-password-generator</code> in your browser.</p>

        <div class="password-row">
          <output id="password" aria-live="polite">Click Generate</output>
          <button id="copy" class="icon-button" type="button" aria-label="Copy password">Copy</button>
        </div>

        <div class="controls">
          <label for="length">Length <output id="length-value">16</output></label>
          <input id="length" type="range" min="4" max="64" value="16" />

          <fieldset>
            <legend>Include</legend>
            <label><input id="lowercase" type="checkbox" checked /> Lowercase</label>
            <label><input id="uppercase" type="checkbox" checked /> Uppercase</label>
            <label><input id="numbers" type="checkbox" checked /> Numbers</label>
            <label><input id="symbols" type="checkbox" checked /> Symbols</label>
          </fieldset>

          <label class="wide-option"><input id="exclude-ambiguous" type="checkbox" /> Exclude ambiguous characters</label>
        </div>

        <button id="generate" class="primary-button" type="button">Generate password</button>
        <p id="message" class="message" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
